<div class="card-container" (click)="onCardClick(activity.id)">
  <div class="image-container">
    <img [src]="activity.pictures?.[0] ?? 'assets/noPhoto.jpg'" alt="{{ activity.name }}" />
  </div>
  <div class="text-container">
    <p class="gray-font">{{ activity.category }}</p>
    <p class="bold-font">{{ activity.name }}</p>
    <p>{{ activity.price }} € / personne</p>
    <p class="gray-font">{{ activity.city }} | {{ activity.duration }} h</p>
  </div>
</div>
